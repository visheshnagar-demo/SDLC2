server:
  port: 8080

spring:
  application:
    name: citidirect-cash-statement-reports
  datasource:
    url: jdbc:h2:mem:citidirect;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: CitiDirectEnterpriseSecureBankingSecretKey2026WithSufficientBitLengthForHS256SignatureVerification!
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:4200,http://localhost:5173,http://localhost:3000,http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
