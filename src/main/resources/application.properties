server.port=8080
spring.application.name=identiverify-backend

# Datasource configuration with sensible local dev H2 defaults, overridable by environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:identiverify;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT configuration
jwt.secret=${JWT_SECRET_KEY:identiverify-super-secret-jwt-key-for-development-must-be-at-least-256-bits-long!}
jwt.expiration=86400000

# CORS
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}
