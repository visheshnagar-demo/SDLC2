server:
  port: 8080

spring:
  application:
    name: citidirect-cash-statement
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:citidirect;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  quartz:
    job-store-type: memory
    properties:
      org.quartz.threadPool.threadCount: 5

jwt:
  secret: ${JWT_SECRET_KEY:citiDirectSecretKeyForJwtSigningMustBeVeryLongAndSecure2026!}
  expiration: 86400000

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:3000}
