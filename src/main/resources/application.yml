server:
  port: 8080

spring:
  application:
    name: citidirect-cash-statement-reports
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:citidirect_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

security:
  jwt:
    secret: ${JWT_SECRET_KEY:c2RscS1hc3Npc3RhbnQtY2l0aWRpcmVjdC1jYXNoLXN0YXRlbWVudC1qd3Qtc2VjcmV0LWtleS0yMDI2LWVudGVycHJpc2UtZ3JhZGU=}
    expiration-ms: 86400000

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000,http://localhost:8080}
