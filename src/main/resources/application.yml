server:
  port: ${PORT:8080}

spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:identitydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:${DATABASE_DRIVER:org.h2.Driver}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET_KEY:dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-security-compliance-2026!}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}
