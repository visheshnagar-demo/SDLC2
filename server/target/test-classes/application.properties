# Overrides main application properties for test execution
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
logging.level.org.springframework.boot.autoconfigure.security=WARN

jwt.secret=test-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-security-compliance-2026!
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200
