<div class="citi-binocular-group" [style.width]="inputWidth">
  <input
    type="text"
    class="citi-binocular-input"
    [value]="value"
    [placeholder]="placeholder"
    [readOnly]="readonly"
    [disabled]="disabled"
    (input)="onInput($event)"
  />

  @if (hasClear && value) {
    <button type="button" class="citi-clear-trigger" (click)="onClear()" title="Clear">
      &times;
    </button>
  }

  <button
    type="button"
    class="citi-binocular-trigger"
    [disabled]="disabled"
    (click)="onTriggerLookup()"
    title="Open Lookup Dialog"
  >
    <svg class="binocular-svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
      <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
    </svg>
  </button>
</div>
