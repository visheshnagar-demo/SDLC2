<div class="citi-stat-card" [ngClass]="'variant-' + variant">
  <div class="card-top">
    <span class="stat-title">{{ title }}</span>
    <div class="stat-icon" [ngClass]="'icon-' + iconType" aria-hidden="true">
      <ng-container [ngSwitch]="iconType">
        <!-- Reports -->
        <svg *ngSwitchCase="'reports'" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
        <!-- Transform -->
        <svg *ngSwitchCase="'transform'" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6a5.87 5.87 0 0 1-2.8-.7l-1.46 1.46A7.93 7.93 0 0 0 12 20c4.42 0 8-3.58 8-8h3l-4-4z"/>
        </svg>
        <!-- Validate -->
        <svg *ngSwitchCase="'validate'" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
        <!-- Migrate -->
        <svg *ngSwitchCase="'migrate'" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <!-- Exceptions -->
        <svg *ngSwitchCase="'exceptions'" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
        </svg>
        <!-- Default Velocity -->
        <svg *ngSwitchDefault viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M13 2.05v3.03c3.39.49 6 3.39 6 6.92 0 .9-.18 1.75-.48 2.54l2.6 1.53c.56-1.24.88-2.62.88-4.07 0-5.18-3.95-9.45-9-9.95zM12 19c-3.87 0-7-3.13-7-7 0-3.53 2.61-6.43 6-6.92V2.05c-5.06.5-9 4.76-9 9.95 0 5.52 4.47 10 9.99 10 3.31 0 6.24-1.61 8.01-4.09l-2.45-1.45C16.14 17.94 14.21 19 12 19z"/>
        </svg>
      </ng-container>
    </div>
  </div>

  <div class="stat-value-row">
    <div class="stat-value">{{ value }}</div>
    <div class="stat-delta" *ngIf="changeDelta" [ngClass]="isPositiveChange ? 'delta-pos' : 'delta-neg'">
      <span>{{ isPositiveChange ? '▲' : '▼' }} {{ changeDelta }}</span>
    </div>
  </div>

  <div class="stat-subtitle" *ngIf="subtitle">
    {{ subtitle }}
  </div>
</div>
