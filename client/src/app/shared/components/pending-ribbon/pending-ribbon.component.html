<section *ngIf="!isDismissed" class="pending-ribbon bg-[#FEF3C7] border border-[#F59E0B] rounded-lg p-3 flex items-center justify-between shadow-sm select-none">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-full bg-[#FDE68A] flex items-center justify-center text-[#B45309] shrink-0">
      <span class="material-symbols-outlined text-[20px]">verified_user</span>
    </div>
    <div>
      <div class="flex items-center gap-2">
        <span class="text-[13px] md:text-[14px] font-bold text-[#78350F]">
          {{ pendingCount }} Pending Maker-Checker Approvals awaiting action
        </span>
        <span class="bg-[#F59E0B] text-white text-[10px] font-bold px-1.5 py-0.5 rounded uppercase">Urgent</span>
      </div>
      <p class="text-[12px] text-[#92400E] m-0 mt-0.5">
        High-value cash statements and intraday MT940 feed schedules awaiting four-eyes verification before cut-off ({{ cutOffTime }}).
      </p>
    </div>
  </div>
  <div class="flex items-center gap-2 shrink-0">
    <a routerLink="/delivery"
       class="bg-[#B45309] hover:bg-[#92400E] text-white font-medium text-[12px] md:text-[13px] px-3 py-1.5 rounded flex items-center gap-1 shadow-sm transition-all text-decoration-none cursor-pointer">
      <span>Authorize / Review Pending</span>
      <span class="material-symbols-outlined text-[16px]">chevron_right</span>
    </a>
    <button (click)="dismiss()"
            class="bg-transparent hover:bg-[#FDE68A] text-[#78350F] text-[12px] px-2.5 py-1.5 rounded border border-[#D97706]/40 transition-colors cursor-pointer">
      Dismiss Notice
    </button>
  </div>
</section>
