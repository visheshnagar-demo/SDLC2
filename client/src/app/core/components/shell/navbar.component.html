<header class="citi-navbar" role="banner">
  <div class="navbar-container">
    <!-- Brand Title & Citi Logo Icon -->
    <div class="brand-section">
      <div class="citi-logo-badge" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="24" height="24" fill="none">
          <rect width="32" height="32" rx="4" fill="#0076D6"/>
          <path d="M16 6C10.477 6 6 10.477 6 16C6 21.523 10.477 26 16 26C21.523 26 26 21.523 26 16" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
          <path d="M16 11V16L20 18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="21" cy="9" r="2.5" fill="#FF4438"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">CitiDirect</span>
        <span class="brand-subtitle">Reporting & Dashboard Assist AI Platform</span>
      </div>
    </div>

    <!-- Navigation Module Links -->
    <nav class="nav-links" role="navigation" aria-label="Main Navigation">
      <a
        *ngFor="let link of navLinks"
        [routerLink]="link.path"
        routerLinkActive="active-link"
        class="nav-item"
        [attr.aria-label]="link.label"
      >
        <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path [attr.d]="link.icon"/>
        </svg>
        <span class="nav-label">{{ link.label }}</span>
      </a>
    </nav>

    <!-- Right Environment Status & User Profile -->
    <div class="navbar-right">
      <div class="env-pill" title="Target: 200,000+ Reports Migration">
        <span class="pulse-dot"></span>
        <span class="env-text">LUMEN UI • MIGRATION ACTIVE</span>
      </div>

      <div class="user-profile" aria-label="Current User">
        <div class="avatar" title="Citi Migration Team Lead">CM</div>
        <div class="user-meta">
          <span class="user-name">Citi Migration Ops</span>
          <span class="user-role">Lead Architect</span>
        </div>
      </div>
    </div>
  </div>
</header>
