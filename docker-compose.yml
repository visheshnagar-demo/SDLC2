version: '3.8'

services:
  app-backend:
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: citidirect-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/citidirect
      - SPRING_DATASOURCE_USERNAME=citidirect_user
      - SPRING_DATASOURCE_PASSWORD=citidirect_pass
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - SPRING_MAIL_HOST=mailhog
      - SPRING_MAIL_PORT=1025
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:4200,http://localhost:5173
      - JWT_SECRET=citi_super_secret_jwt_key_for_testing_purposes_only_32bytes_min
    depends_on:
      - postgres-db
      - mailhog
    restart: unless-stopped

  app-frontend:
    build:
      context: client
      dockerfile: Dockerfile
    container_name: citidirect-frontend
    ports:
      - "80:80"
    depends_on:
      - app-backend
    restart: unless-stopped

  postgres-db:
    image: postgres:16-alpine
    container_name: citidirect-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=citidirect
      - POSTGRES_USER=citidirect_user
      - POSTGRES_PASSWORD=citidirect_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: citidirect-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

volumes:
  postgres_data:
